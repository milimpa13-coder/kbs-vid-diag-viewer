<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>물품 현황</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #1b1b1b; color: #eee;
    font-family: -apple-system, "Malgun Gothic", sans-serif;
  }
  header {
    padding: 20px 20px 8px;
    display: flex; align-items: center; gap: 12px;
  }
  header a.back {
    background: #3a3a3a; color: #eee; border-radius: 8px;
    width: 36px; height: 36px; display: flex; align-items: center;
    justify-content: center; text-decoration: none; font-size: 18px;
    flex-shrink: 0;
  }
  header h1 { font-size: 18px; margin: 0; }
  #cards {
    display: flex; flex-direction: column; gap: 12px;
    padding: 16px 20px 30px; max-width: 480px; margin: 0 auto;
  }
  a.card {
    display: flex; align-items: center; gap: 14px;
    background: #262626; border-radius: 12px; padding: 16px;
    text-decoration: none; color: #eee;
    box-shadow: 0 2px 8px rgba(0,0,0,.4);
    border: 1px solid #333;
  }
  a.card:active { background: #333; }
  .icon {
    font-size: 22px; width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    background: #3a3a3a; border-radius: 8px; flex-shrink: 0;
  }
  .card .label { font-size: 15px; font-weight: 600; }
  .card .sub { font-size: 11px; color: #999; margin-top: 2px; }
</style>
</head>
<body>
  <header>
    <a class="back" href="index.html">‹</a>
    <h1>물품 현황</h1>
  </header>
  <div id="cards">
    <a class="card" href="inventory-video.html">
      <div class="icon">📹</div>
      <div><div class="label">비디오 장비</div><div class="sub">Cable Drum, Cam 커버 등</div></div>
    </a>
    <a class="card" href="inventory-audio.html">
      <div class="icon">🎙️</div>
      <div><div class="label">오디오 장비</div><div class="sub">Audio Monitor, Mic, Speaker 등</div></div>
    </a>
  </div>
</body>
</html>
