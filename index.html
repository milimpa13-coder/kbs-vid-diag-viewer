<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>TV-2</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #1b1b1b; color: #eee;
    font-family: -apple-system, "Malgun Gothic", sans-serif;
  }
  header {
    padding: 32px 20px 8px;
    text-align: center;
  }
  header h1 { font-size: 22px; margin: 0 0 4px; }
  header p { font-size: 13px; color: #999; margin: 0; }
  #cards {
    display: flex; flex-direction: column; gap: 16px;
    padding: 24px; max-width: 480px; margin: 0 auto;
  }
  a.card {
    display: flex; align-items: center; gap: 18px;
    background: #262626; border-radius: 16px; padding: 26px 22px;
    text-decoration: none; color: #eee;
    box-shadow: 0 2px 8px rgba(0,0,0,.4);
    border: 1px solid #333;
  }
  a.card:active { background: #333; }
  .icon {
    font-size: 34px; width: 56px; height: 56px;
    display: flex; align-items: center; justify-content: center;
    background: #3a3a3a; border-radius: 12px; flex-shrink: 0;
  }
  .card .label { font-size: 19px; font-weight: 700; }
  .card .sub { font-size: 12.5px; color: #999; margin-top: 3px; }
</style>
</head>
<body>
  <header>
    <h1>TV-2</h1>
    <p>보고 싶은 항목을 선택하세요</p>
  </header>
  <div id="cards">
    <a class="card" href="diagrams.html">
      <div class="icon">📐</div>
      <div>
        <div class="label">TV-2 도면</div>
        <div class="sub">Rack Layout, Video, Audio, Connection Panels, Control</div>
      </div>
    </a>
    <a class="card" href="inventory.html">
      <div class="icon">📦</div>
      <div>
        <div class="label">물품 현황</div>
        <div class="sub">Cable Drum, Cam 커버 등 재고 관리</div>
      </div>
    </a>
    <a class="card" href="accounts.html">
      <div class="icon">🔐</div>
      <div>
        <div class="label">계정 정보</div>
        <div class="sub">장비/서비스 계정, 비밀번호 관리</div>
      </div>
    </a>
    <a class="card" href="worktime.html">
      <div class="icon">⏱️</div>
      <div>
        <div class="label">주 52시간</div>
        <div class="sub">이번 주 근무시간, 연차/반차 계산</div>
      </div>
    </a>
  </div>
</body>
</html>
